[project]
name = "openclass-provider-glm"
version = "0.0.1"
description = "OpenClass GLM discovery provider"
requires-python = ">=3.12"
dependencies = ["openclass-core==0.0.1", "httpx>=0.28,<1", "pydantic>=2.10,<3"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openclass_provider_glm"]
