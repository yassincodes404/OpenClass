[project]
name = "openclass-server"
version = "0.0.1"
description = "OpenClass server"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["openclass-core==0.0.1", "openclass-provider-mock==0.0.1", "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy[asyncio]>=2.0.54,<3", "alembic>=1.15,<2", "asyncpg>=0.30,<1", "aiosqlite>=0.21,<1", "pydantic-settings>=2.8,<3"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openclass_server"]
