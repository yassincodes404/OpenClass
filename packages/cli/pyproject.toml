[project]
name = "openclass-cli"
version = "0.0.1"
description = "OpenClass cli"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["openclass-sdk==0.0.1", "openclass-server==0.0.1"]

[build-system]
requires = ["hatchling>=1.32.3,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openclass_cli"]

[project.scripts]
openclass = "openclass_cli.main:main"
