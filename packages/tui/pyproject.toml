[project]
name = "openclass-tui"
version = "0.0.1"
description = "OpenClass terminal inspector"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["openclass-sdk==0.0.1", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openclass_tui"]

[project.scripts]
openclass-tui = "openclass_tui.main:main"
