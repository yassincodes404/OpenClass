name: openclass
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    profiles: [portal-identity]
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me-local-only}
      KC_HOSTNAME: http://127.0.0.1:${KEYCLOAK_PORT:-8080}
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    volumes:
      - ${OPENCLASS_KEYCLOAK_REALM_DIR:-./services/control-plane/keycloak}:/opt/keycloak/data/import:ro
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-c",
          "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /realms/openclass-local/.well-known/openid-configuration HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: openclass
      POSTGRES_PASSWORD: ${OPENCLASS_DB_PASSWORD:-openclass}
      POSTGRES_DB: openclass
    ports:
      - "127.0.0.1:${OPENCLASS_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openclass -d openclass"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: .
    environment:
      OPENCLASS_DATABASE_URL: postgresql+asyncpg://openclass:${OPENCLASS_DB_PASSWORD:-openclass}@db:5432/openclass
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  server:
    build: .
    environment:
      # Deterministic simulated inference; no ambient model credentials forwarded.
      OPENCLASS_DECISION_PROVIDER: ${OPENCLASS_DECISION_PROVIDER:-mock}
      OPENCLASS_DATABASE_URL: postgresql+asyncpg://openclass:${OPENCLASS_DB_PASSWORD:-openclass}@db:5432/openclass
      # The loopback-only base demo is deliberately no-key. Workspace deployments
      # must also load docker/full-stack.compose.yml, which forces authentication.
      OPENCLASS_AUTH_REQUIRED: ${OPENCLASS_AUTH_REQUIRED:-false}
      OPENCLASS_INTERNAL_TOKEN: ${OPENCLASS_INTERNAL_TOKEN:-}
    ports:
      - "127.0.0.1:${OPENCLASS_PORT:-7331}:7331"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:7331/health/ready')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
  test:
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      OPENCLASS_TEST_DATABASE_URL: postgresql+asyncpg://openclass:${OPENCLASS_DB_PASSWORD:-openclass}@db:5432/openclass
      OPENCLASS_DECISION_PROVIDER: mock
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
