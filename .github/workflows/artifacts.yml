name: Review release artifacts
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.0"
          python-version: "3.12"
      - run: uv sync --all-packages --locked
      - run: uv run python scripts/release.py
      - run: uv run pytest -m 'not postgres'
      - run: uv build --all-packages
      - run: sha256sum dist/* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: genesis-review-artifacts
          path: |
            dist/
            SHA256SUMS

# Publication remains disabled until OC-002 and OC-014 release gates are satisfied.
