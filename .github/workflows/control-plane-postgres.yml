name: Control-plane PostgreSQL
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: control-postgres-${{ github.ref }}
  cancel-in-progress: true
jobs:
  persistence:
    name: Control-plane real PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: openclass
          POSTGRES_PASSWORD: openclass
          POSTGRES_DB: control_plane_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U openclass -d control_plane_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CONTROL_PLANE_DATABASE_URL: postgresql://openclass:openclass@127.0.0.1:5432/control_plane_test
      CONTROL_PLANE_TEST_DATABASE_URL: postgresql://openclass:openclass@127.0.0.1:5432/control_plane_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openclass/control-plane migrate
      - run: pnpm --filter @openclass/control-plane migrate
      - run: pnpm --filter @openclass/control-plane test:postgres
