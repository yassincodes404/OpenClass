name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: openclass
          POSTGRES_PASSWORD: openclass
          POSTGRES_DB: openclass_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U openclass -d openclass_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      OPENCLASS_TEST_DATABASE_URL: postgresql+asyncpg://openclass:openclass@localhost:5432/openclass_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.0"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-packages --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - run: uv build --all-packages
      - run: uv run python scripts/release.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
  web:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - run: npm audit --omit=dev --audit-level=high
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build -d --wait
      - run: >-
          docker compose exec -T server python -c
          "import urllib.request; assert urllib.request.urlopen('http://localhost:7331/health/ready').status == 200"
      - run: docker compose exec -T server openclass init examples/support-intents/classifier.json
      - run: docker compose exec -T server openclass classify "Cancel my plan"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.0"
          python-version: "3.12"
      - run: uv export --frozen --no-dev --no-emit-workspace --format requirements-txt > /tmp/requirements.txt
      - run: uvx pip-audit -r /tmp/requirements.txt
