name: Bug report
description: Report a reproducible defect (no private data or secrets)
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include version, OS, provider, and sanitized steps or logs.
    validations:
      required: true
